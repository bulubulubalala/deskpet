<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 渲染层只加载自己的文件：禁内联脚本/样式，也不连外网（需求 §7.4 注入与隐私防线） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>deskpet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pet">
    <!--
      桌宠形态（F11 / §6.11）：窗口里只有立绘和它下面的聊天条。
      立绘整体是拖动把手（-webkit-app-region: drag），聊天条与气泡一律 no-drag。
    -->
    <div id="stage" class="stage" data-interactive="true">
      <!-- 拖动把手（T2.2）：透明像素在 Windows 上不参与命中测试，光靠透明区拖不动窗口，
           所以给把手一块真正画出来的底。做成左上角的小药丸（不盖住立绘的头），
           立绘本身也能拖；M3 接入真实立绘后仍然留着它当显式抓握点。 -->
      <div id="stage-grip" class="stage-grip" data-interactive="true" title="按住这里拖动窗口">
        <span class="grip-dots">⠿</span>
        <span id="grip-name" class="grip-name">deskpet</span>
      </div>
      <img
        id="character"
        class="character"
        src="assets/placeholder.png"
        alt="角色立绘"
        draggable="false"
      />
      <p id="banner" class="banner" hidden></p>
      <div id="bubble" class="bubble" hidden>
        <span id="bubble-speaker" class="bubble-speaker"></span>
        <span id="bubble-text" class="bubble-text"></span>
      </div>
      <!-- 模块健康收成一个小圆点（§6.11 取消独立状态面板），细节进设置窗与托盘 tooltip -->
      <span id="health-dot" class="health-dot starting" title="后台引擎：正在启动"></span>
    </div>

    <!--
      聊天条两行（T2.2 真机反馈）：输入框独占一行、自动换行变高；按钮在下一行，
      不再和输入框抢横向空间。textarea 而不是 input——只有 textarea 能换行。
      Enter 发送、Shift+Enter 换行；输入框必须是 no-drag，否则点不进去也选不了字。
    -->
    <div id="chatbar" class="chatbar" data-interactive="true">
      <textarea
        id="chat-input"
        class="chat-input"
        rows="1"
        placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
        autocomplete="off"
      ></textarea>
      <div class="chat-actions">
        <button
          id="mic-button"
          class="icon-button"
          type="button"
          title="免提（常开麦）：点一下开始听，再点一下关掉"
          aria-pressed="false"
        >
          🎤
        </button>
        <button
          id="interact-button"
          class="icon-button"
          type="button"
          title="互动模式（开启后点 / 摸立绘，拖动改用顶部把手）"
          aria-pressed="false"
        >
          互动
        </button>
        <button
          id="interrupt-button"
          class="icon-button"
          type="button"
          title="打断当前回复"
          disabled
        >
          打断
        </button>
        <button
          id="pause-button"
          class="icon-button"
          type="button"
          title="暂停记录（M2 提供）"
          disabled
        >
          ⏸
        </button>
        <span id="voice-state" class="voice-state">空闲</span>
        <span class="actions-spacer"></span>
        <div class="menu-anchor">
          <button id="char-button" class="icon-button" type="button" title="切换角色">角色</button>
          <div id="char-popup" class="popup" hidden></div>
        </div>
        <button id="minimize-button" class="icon-button" type="button" title="最小化到托盘">
          最小
        </button>
        <button id="settings-button" class="icon-button" type="button" title="打开设置">
          设置
        </button>
        <button id="send-button" class="icon-button" type="button" title="发送（Enter）">
          发送
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
